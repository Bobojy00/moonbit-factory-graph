name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check-and-test:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MoonBit Toolchain
        uses: chawyehsu/setup-moonup@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Fallback Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          if ! command -v moon &> /dev/null; then
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          fi

      - name: Fallback Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Get-Command moon -ErrorAction SilentlyContinue)) {
            irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
            "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify MoonBit Version
        run: moon version

      - name: Check Strict Types & Deny Warnings
        run: moon check --deny-warn

      - name: Check Code Formatting
        run: moon fmt --check

      - name: Check Public Interfaces (.mbti)
        run: |
          moon info
          git diff --exit-code

      - name: Run CLI Demo
        run: moon run cmd/main -- demo

      - name: Run Performance Benchmark
        run: moon run cmd/main -- bench
